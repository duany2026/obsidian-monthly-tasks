name: Release

# 推送 v* 标签时自动打包插件并创建 Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 打包插件
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          rm -rf dist
          mkdir -p dist/monthly-tasks
          cp main.js manifest.json styles.css holidays.json versions.json README.md LICENSE dist/monthly-tasks/
          cd dist
          zip -r "monthly-tasks-${VER}.zip" monthly-tasks
          ls -l

      - name: 从 CHANGELOG 提取发行说明
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            printf '月历任务 %s\n' "$VER" > RELEASE_NOTES.md
          fi
          head -20 RELEASE_NOTES.md

      - name: 创建 / 更新 Release
        env:
          # 优先使用仓库 Secret 里的 RELEASE_TOKEN（属于你本人的令牌），
          # 这样发行版页面显示的发布人是「duany2026」而不是 github-actions[bot]。
          # 未配置该 Secret 时自动回退到内置 token（发布人显示为机器人）。
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/monthly-tasks-*.zip --clobber
            gh release edit "$TAG" \
              --title "月历任务 ${TAG}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" dist/monthly-tasks-*.zip \
              --title "月历任务 ${TAG}" \
              --notes-file RELEASE_NOTES.md
          fi
