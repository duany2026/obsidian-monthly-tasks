name: Release

# 推送 v* 标签时自动打包插件并创建 Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 打包插件
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          rm -rf dist
          mkdir -p dist/monthly-tasks
          cp main.js manifest.json styles.css holidays.json versions.json README.md LICENSE dist/monthly-tasks/
          cd dist
          zip -r "monthly-tasks-${VER}.zip" monthly-tasks
          ls -l

      - name: 从 CHANGELOG 提取发行说明
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            printf '月历任务 %s\n' "$VER" > RELEASE_NOTES.md
          fi
          head -20 RELEASE_NOTES.md

      - name: 创建 / 更新 Release
        env:
          # 先试仓库 Secret 里的个人令牌 RELEASE_TOKEN——用它发布时，发行版页面的发布人是「duany2026」。
          # 该 Secret 缺失、写错或**已过期**时，自动退回内置 GITHUB_TOKEN（发布人显示为机器人）。
          # 旧写法是 `secrets.RELEASE_TOKEN || github.token`：那个 `||` 只在 Secret 完全不存在时才回退，
          # 令牌过期后它照样被选中，于是整条发布链在「Bad credentials」上静默断掉（2026-10-13 实际踩到）。
          PERSONAL_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RUNNER_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          publish() {
            export GH_TOKEN="$1"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/monthly-tasks-*.zip --clobber || return 1
              gh release edit "$TAG" \
                --title "月历任务 ${TAG}" \
                --notes-file RELEASE_NOTES.md || return 1
            else
              gh release create "$TAG" dist/monthly-tasks-*.zip \
                --title "月历任务 ${TAG}" \
                --notes-file RELEASE_NOTES.md || return 1
            fi
          }
          if [ -n "${PERSONAL_TOKEN:-}" ] && publish "$PERSONAL_TOKEN"; then
            echo "已用个人令牌发布（发布人＝令牌属主）"
          elif publish "$RUNNER_TOKEN"; then
            echo "个人令牌不可用，已退回内置令牌发布（发布人＝github-actions[bot]）；请尽快更新 RELEASE_TOKEN"
          else
            echo "::error::个人令牌与内置令牌都无法创建 Release"
            exit 1
          fi
